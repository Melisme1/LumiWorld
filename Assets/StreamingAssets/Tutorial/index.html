<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumiWorld | Hướng dẫn</title>
<style>
:root{--ink:#26392f;--muted:#68786d;--leaf:#53865f;--cream:#fbf7eb;--line:#e4ddc9;--gold:#e5b657}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#dcebd7,#eff4e7 46%,#d8e6d3);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:32px 22px 70px}.hero{padding:42px;border-radius:28px;background:linear-gradient(120deg,#284b3b,#4f8057);color:white;position:relative;overflow:hidden;box-shadow:0 16px 38px #25453630}.hero:after{content:'🌿';position:absolute;font-size:190px;right:45px;top:-18px;opacity:.17}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:#d9e8c8}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:10px 0}.hero p{max-width:650px;color:#e5eee0}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 28px}.nav a{background:#fff9;border:1px solid #ffffff80;border-radius:99px;padding:8px 15px;color:var(--ink);text-decoration:none;font-weight:650}.section-title{font-size:28px;margin:34px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 7px 20px #354a3210}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e9f0dc;color:var(--leaf);font-weight:800}.art{height:112px;border-radius:15px;background:linear-gradient(145deg,#d9ebc7,#f9e8b2);display:grid;place-items:center;font-size:62px;margin:14px 0}.card h3{margin:8px 0 4px}.card p{margin:0;color:var(--muted)}.feature{display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center}.icon{height:72px;border-radius:18px;background:#edf0df;display:grid;place-items:center;font-size:38px}.tip{margin-top:24px;padding:18px 22px;border-left:4px solid var(--gold);background:#fff9e8;border-radius:0 15px 15px 0;color:#5b553f}footer{text-align:center;color:var(--muted);padding:35px 0 0}@media(max-width:600px){.wrap{padding:16px 12px 40px}.hero{padding:27px}.hero:after{right:-24px;font-size:135px}.feature{grid-template-columns:64px 1fr}.icon{height:60px}}
.tutorial-layout{display:block}.tutorial-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tutorial-card{padding:16px;display:grid;grid-template-columns:38px 56px 1fr auto;gap:12px;align-items:center}.tutorial-card .art{height:56px;width:56px;margin:0;font-size:32px}.tutorial-card h3{font-size:16px;margin:0 0 3px}.tutorial-card p{display:none}.detail-btn{border:0;border-radius:99px;background:#53865f;color:white;padding:8px 13px;font-weight:750;cursor:pointer}.detail-btn:hover{background:#3d6e49}.detail-panel{display:none}.detail-panel.open{display:block;position:fixed;z-index:10;right:24px;top:50%;transform:translate(110%,-50%);width:min(380px,calc(100vw - 32px));max-height:82vh;overflow:auto;background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 14px 44px #1f352b45;animation:slide-in .28s ease-out forwards}.detail-panel h3{margin:8px 0}.detail-panel p,.detail-panel li{color:var(--muted)}.detail-panel .art{height:130px}.detail-panel .close-detail{float:right;border:0;border-radius:50%;width:34px;height:34px;background:#e9e3d7;color:var(--ink);font-size:20px;cursor:pointer}@keyframes slide-in{to{transform:translate(0,-50%)}}.detail-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:700px){.tutorial-list{grid-template-columns:1fr}.detail-panel.open{right:12px}}
.detail-panel{display:none}.detail-panel.open{display:block;position:fixed;z-index:1000;inset:0;right:0;top:0;width:auto;max-height:none;transform:none;background:#14251ecc;overflow:auto;padding:4vh 3vw;box-shadow:none;border:0;border-radius:0;animation:fade-in .18s ease-out}.detail-dialog{position:relative;margin:auto;width:min(1180px,100%);max-height:92vh;overflow:auto;background:var(--cream);border:1px solid #d8ceb9;border-radius:24px;padding:30px;box-shadow:0 24px 80px #10251e70;transform:translateY(20px);animation:dialog-in .24s ease-out forwards}.detail-head{display:flex;align-items:center;gap:14px;padding:0 48px 18px 0}.detail-head .art{flex:none;width:58px;height:58px;margin:0;font-size:34px}.detail-head h2{margin:0;font-size:25px}.detail-head p{margin:2px 0 0;color:var(--muted)}.detail-panel .close-detail{position:absolute;right:20px;top:18px;border:0;border-radius:50%;width:40px;height:40px;background:#e9e3d7;color:var(--ink);font-size:25px;cursor:pointer}.step-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 30px}.flow-step{position:relative;min-width:0}.flow-img{height:clamp(150px,22vw,250px);border-radius:16px;background:linear-gradient(145deg,#dcebd7,#f9e8b2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:60px}.flow-caption{padding:12px 8px 4px;color:var(--muted);font-size:15px}.flow-number{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e9f0dc;color:var(--leaf);font-weight:800;margin-right:7px}.flow-arrow{position:absolute;right:-25px;top:42%;font-size:27px;color:var(--leaf);font-weight:900}@keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes dialog-in{to{transform:translateY(0)}}@media(max-width:700px){.detail-panel.open{padding:12px}.detail-dialog{padding:20px 14px}.step-flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.flow-arrow{display:none}.flow-img{height:150px}}
.detail-panel.open{overflow:hidden!important}.detail-dialog{overflow:hidden!important;padding:24px!important;max-height:92vh}.flow-img{height:clamp(110px,19vh,210px)}.flow-caption{text-align:left;line-height:1.45;overflow-wrap:anywhere}.flow-caption p{margin:8px 0}.flow-caption ol,.flow-caption ul{margin:7px 0;padding-left:20px}.flow-caption li{margin:3px 0}.step-flow{gap:18px 26px}.flow-arrow{right:-22px}.detail-head{padding-bottom:12px}.detail-head p{margin:2px 0}.detail-dialog{scrollbar-width:none}.detail-dialog::-webkit-scrollbar,.detail-panel.open::-webkit-scrollbar{display:none}@media(max-height:720px){.detail-panel.open{padding:2vh 2vw}.detail-dialog{max-height:96vh;padding:16px!important}.flow-img{height:clamp(90px,15vh,150px)}.flow-caption{font-size:13px}}
.flow-img{position:relative}.flow-img img{display:block;width:100%;height:100%;object-fit:contain}.image-placeholder{color:#69816e;text-align:center;font-size:14px;padding:14px}.image-placeholder strong{display:block;font-size:34px;margin-bottom:6px}.detail-head .art{display:none}.flow-img img{position:absolute;inset:0;object-fit:contain;padding:8px}.flow-img .image-placeholder{position:absolute;inset:0;display:grid;align-content:center;justify-items:center}.flow-caption{text-align:left;overflow-wrap:anywhere}.flow-caption p{margin:6px 0}.detail-panel.open{overflow:hidden}.detail-dialog{overflow:auto}.step-flow{align-items:start}.flow-step{min-width:0}.flow-caption ol,.flow-caption ul{padding-left:20px}
.flow-img{height:auto!important;aspect-ratio:1/1;width:100%;max-width:320px;margin:0 auto}.flow-img img{object-fit:contain}.flow-step{display:flex;flex-direction:column}.flow-caption{width:100%;min-height:76px}.step-flow{gap:20px 28px}@media(max-width:700px){.step-flow{grid-template-columns:repeat(2,minmax(0,1fr))}.flow-img{max-width:260px}}
.detail-dialog{overflow:hidden!important}.step-flow{max-height:calc(92vh - 150px);overflow-y:auto;overflow-x:hidden;padding:4px 14px 16px 4px;scrollbar-width:thin;scrollbar-color:#78927b #e8e1d4;cursor:grab}.step-flow:active{cursor:grabbing}.step-flow::-webkit-scrollbar{width:12px}.step-flow::-webkit-scrollbar-track{background:#e8e1d4;border-radius:10px}.step-flow::-webkit-scrollbar-thumb{background:#78927b;border:3px solid #e8e1d4;border-radius:10px}@media(max-height:720px){.step-flow{max-height:calc(96vh - 125px)}}
.step-flow{padding-right:22px;user-select:none;cursor:grab}.step-flow:active{cursor:grabbing}.step-flow .flow-step{padding-right:18px}.step-flow .flow-arrow{right:0;z-index:2;background:var(--cream);border-radius:50%;padding:0 3px}.step-flow::-webkit-scrollbar{width:16px}.step-flow::-webkit-scrollbar-thumb{background:#78927b;border:3px solid #e8e1d4;border-radius:10px;min-height:38px}.step-flow::-webkit-scrollbar-track{background:#e8e1d4;border-radius:10px}
.step-flow{padding-left:2px;padding-right:16px;scrollbar-gutter:stable both-edges;justify-content:center;grid-template-columns:repeat(3,minmax(0,1fr))}.step-flow .flow-step{padding-right:0}.step-flow .flow-arrow{right:-18px}
.tutorial-card-wrap{min-width:0;display:grid;grid-template-columns:1fr}.tutorial-steps{display:block;grid-column:1/-1;margin-top:12px;padding:16px;background:#f1ecdf;border:1px solid var(--line);border-radius:16px}.tutorial-card-wrap>.tutorial-card{grid-column:1}.tutorial-card-wrap .tutorial-card{padding:10px 14px;min-height:68px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;justify-items:start}.tutorial-card-wrap .tutorial-card .num,.tutorial-card-wrap .tutorial-card .detail-btn{display:none!important}.tutorial-card-wrap .tutorial-card .art{margin:0}.tutorial-card-wrap .step-flow{max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:8px;scrollbar-gutter:auto;cursor:auto}.tutorial-card-wrap .flow-step{padding:0}.tutorial-card-wrap .flow-arrow{display:none}.tutorial-card-wrap .flow-img{width:100%;max-width:none;aspect-ratio:1/1;height:auto}.tutorial-card-wrap .flow-caption{min-height:60px}@media(max-width:700px){.tutorial-card-wrap .step-flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.tutorial-list{grid-template-columns:minmax(0,1fr)}.tutorial-card-wrap{width:100%}.tutorial-card-wrap .step-flow{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:row;align-items:start}.tutorial-card-wrap .flow-arrow{display:none}.tutorial-card-wrap .tutorial-steps{width:100%}
.tutorial-card-wrap>.tutorial-card{width:max-content;min-width:250px;max-width:100%;grid-template-columns:56px max-content;padding-right:22px}.tutorial-card-wrap>.tutorial-card h3{white-space:nowrap}@media(max-width:500px){.tutorial-card-wrap>.tutorial-card{width:100%;grid-template-columns:56px minmax(0,1fr)}.tutorial-card-wrap>.tutorial-card h3{white-space:normal}}
.tutorial-card-wrap>.tutorial-card{width:fit-content;min-width:0;max-width:100%;grid-template-columns:48px max-content;gap:8px;padding:8px 12px}.tutorial-card-wrap>.tutorial-card .art{width:48px;height:48px}.tutorial-card-wrap>.tutorial-card h3{white-space:nowrap}@media(max-width:500px){.tutorial-card-wrap>.tutorial-card{width:100%;grid-template-columns:48px minmax(0,1fr)}.tutorial-card-wrap>.tutorial-card h3{white-space:normal}}
.tutorial-card-wrap>.tutorial-card .art{display:none!important}.tutorial-card-wrap>.tutorial-card{grid-template-columns:max-content}.tutorial-card-wrap>.tutorial-card h3{text-transform:uppercase}
#bat-dau{margin-top:26px}.tutorial-list{margin-top:0}
</style>
</head>
<body><main class="wrap">
<header class="hero"><div class="eyebrow">LumiWorld</div><h1>Hướng Dẫn<br>người chơi mới</h1><p>Khám phá những hòn đảo lục giác, xây dựng hệ sinh thái, chăm sóc sinh vật và phát triển hòn đảo theo cách của riêng bạn.</p></header>

<section id="bat-dau"><div class="tutorial-layout"><div class="tutorial-list">
<article class="card tutorial-card" data-title="Thẻ bài" data-icon="🃏"><div class="num">1</div><div class="art">🃏</div><div><h3>Thẻ bài</h3></div><button class="detail-btn" type="button">Detail</button></article>
<article class="card tutorial-card" data-title="Thẻ môi trường" data-icon="⬡"><div class="num">2</div><div class="art">⬡</div><div><h3>Thẻ môi trường</h3></div><button class="detail-btn" type="button">Detail</button></article>
<article class="card tutorial-card" data-title="Thẻ Thú" data-icon="🌱"><div class="num">3</div><div class="art">🌱</div><div><h3>Thẻ thú</h3></div><button class="detail-btn" type="button">Detail</button></article>
<article class="card tutorial-card" data-title="Thu hút sinh vật" data-icon="🦊"><div class="num">4</div><div class="art">🦊</div><div><h3>Thu hút sinh vật</h3></div><button class="detail-btn" type="button">Detail</button></article>
</div><aside class="detail-panel" id="step-detail" aria-live="polite"></aside></div></section>

<footer>LumiWorld · Mỗi hòn đảo là một câu chuyện của riêng bạn.</footer>
</main><script>
// Mỗi mục Detail có bộ ảnh riêng. Link tương đối tính từ thư mục chứa index.html.
// Ví dụ đúng: "img/1.png" (không ghi lại "Assets/StreamingAssets/Tutorial/").
const tutorialImages={
  'Thẻ bài':['img/1.png','img/3.png','img/2.png'],
  'Thẻ môi trường':['img/Nature.png','img/ruleNature.png','img/natureBeauty.png'],
  'Thẻ Thú':['','',''],
  'Thu hút sinh vật':['','','']
};
// Thêm/bớt step bằng cách thêm/xóa object trong mảng steps của mục tương ứng.
const tutorialSteps={
 'Thẻ bài':[
  {image:'img/1.png',text:'Chọn nhóm thẻ trong khay bài.'},
  {image:'img/3.png',text:'Kéo thẻ bài vào ô đất; số trên thẻ là số lượng đang có.'},
  {image:'img/2.png',text:'Hoàn tất thao tác và xem thay đổi của khối đất.'}
 ],
 'Thẻ môi trường':[
  {image:'img/Nature.png',text:'Chọn thẻ môi trường sau khi đã sử dụng thẻ mưa.'},
  {image:'img/ruleNature.png',text:'Mỗi thẻ môi trường có nguyên tắc đặt dựa trên độ cao của Hex.'},
  {image:'img/natureBeauty.png',text:'Nhóm từ 3 Hex phù hợp trở lên sẽ tạo môi trường tốt hơn.'}
 ],
 'Thẻ Thú':[
  {image:'img/DragCreature.png',text:'Kéo thú vào địa hình đã có Môi trường trên 3 Hex.'},
  {image:'img/Creture.png',text:'Click vào môi trường để hiển thị thông tin của môi trường và click vào thú sẽ hiển thị trạng thái của thú.'},
  {image:'img/CretureCollection.png',text:'Những thẻ thú bạn sở hữu sẽ mở khóa ở collection'},
  {image:'img/CreatureKhaithac.png',text:'Assign khai thác tài nguyên cần các con thú phù hợp để assign'},
  {image:'img/CreatureTame.png',text:'Đôi khi sẽ có những thú hoang sẽ xuất hiện ở môi trường của bạn click vào để bắt nhé'}
  
 ],
 'Thu hút sinh vật':[
  {image:'',text:'Tạo habitat phù hợp với loài thú.'},
  {image:'',text:'Theo dõi sinh vật xuất hiện trên đảo.'},
  {image:'',text:'Nhận thẻ thú và khám phá loài đó trong Collection.'},
  {image:'',text:'Nhận thẻ thú và khám phá loài đó trong Collection.'}
 ]
};
const detailPanel=document.getElementById('step-detail');
function enableDragScroll(element){
 let dragging=false,startY=0,startTop=0;
 element.addEventListener('pointerdown',event=>{
  if(event.target.closest('button,a'))return;
  dragging=true;startY=event.clientY;startTop=element.scrollTop;
  element.setPointerCapture(event.pointerId);
 });
 element.addEventListener('pointermove',event=>{
  if(!dragging)return;
  element.scrollTop=startTop-(event.clientY-startY);
 });
 const stop=()=>{dragging=false};
 element.addEventListener('pointerup',stop);element.addEventListener('pointercancel',stop);
}
function tutorialImage(src,alt,fallback){
 if(!src)return '<div class="image-placeholder"><strong>'+fallback+'</strong>Thêm link ảnh tại tutorialImages</div>';
 return '<img src="'+src.replaceAll('&','&amp;').replaceAll('"','&quot;')+'" alt="'+alt+'">';
}
document.querySelectorAll('.tutorial-card').forEach(card=>{
 card.querySelector('h3').textContent=card.dataset.title;
 const wrap=document.createElement('div');wrap.className='tutorial-card-wrap expanded';
 card.parentNode.insertBefore(wrap,card);wrap.appendChild(card);
 const steps=tutorialSteps[card.dataset.title]||[];
 const stepHost=document.createElement('section');stepHost.className='tutorial-steps';
 stepHost.innerHTML='<div class="step-flow">'+steps.map((step,i)=>'<article class="flow-step"><div class="flow-img">'+tutorialImage(step.image,step.text,card.dataset.icon)+'</div><div class="flow-caption"><span class="flow-number">'+(i+1)+'</span>'+step.text+'</div>'+(i<steps.length-1?'<span class="flow-arrow">➜</span>':'')+'</article>').join('')+'</div>';
 wrap.appendChild(stepHost);
 stepHost.querySelectorAll('.flow-img img').forEach(img=>img.addEventListener('error',()=>{img.replaceWith(Object.assign(document.createElement('div'),{className:'image-placeholder',innerHTML:'<strong>＋</strong>Không tải được ảnh. Kiểm tra link.'}));}));
 const detailButton=card.querySelector('.detail-btn');if(detailButton)detailButton.remove();
});
</script></body></html>
