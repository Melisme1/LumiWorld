# Docker Compose for LumiWorld Staging (Defense 1.1)
# Usage (from repository root with backend files api/ + database/ + Staging/):
#   cp Staging/.env.staging.example Staging/.env.staging
#   docker compose -f Staging/docker-compose.yml --env-file Staging/.env.staging up -d --build
# With automatic HTTPS domain (Caddy):
#   docker compose -f Staging/docker-compose.yml --env-file Staging/.env.staging --profile https up -d --build

services:
  db:
    image: postgres:18
    container_name: lumi-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: postgres
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${STAGING_PG_PORT:-5432}:5432"
    volumes:
      - lumi_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-migrate:
    image: postgres:18
    container_name: lumi-staging-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      LUMI_OWNER_PASSWORD: ${LUMI_OWNER_PASSWORD:?Set LUMI_OWNER_PASSWORD}
      LUMI_APP_PASSWORD: ${LUMI_APP_PASSWORD:?Set LUMI_APP_PASSWORD}
      LUMI_REPORT_PASSWORD: ${LUMI_REPORT_PASSWORD:?Set LUMI_REPORT_PASSWORD}
    volumes:
      - ../database:/database:ro
      - ./db-bootstrap.sh:/db-bootstrap.sh:ro
    entrypoint: ["bash", "/db-bootstrap.sh"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Staging/Dockerfile
    container_name: lumi-staging-api
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Lumi: Host=db;Port=5432;Database=lumi;Username=lumi_app;Password=${LUMI_APP_PASSWORD}
      Jwt__Key: ${LUMI_JWT_KEY:?Set LUMI_JWT_KEY (>= 32 chars)}
      RateLimit__AuthPerMinute: ${STAGING_AUTH_RATE_LIMIT:-30}
    ports:
      - "${STAGING_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    volumes:
      - lumi_staging_logs:/app/logs

  caddy:
    image: caddy:2-alpine
    container_name: lumi-staging-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set STAGING_DOMAIN (e.g. staging-lumi.example.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - lumi_staging_caddy_data:/data
      - lumi_staging_caddy_config:/config

volumes:
  lumi_staging_pgdata:
  lumi_staging_logs:
  lumi_staging_caddy_data:
  lumi_staging_caddy_config:
